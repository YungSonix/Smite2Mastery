<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skin loadout frame preview (586×940)</title>
  <style>
    :root {
      --frame-w: 586px;
      --frame-h: 940px;
      --bg: #030712;
      --border: rgba(125, 211, 252, 0.42);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #0b1220;
      color: var(--text);
      padding: 24px;
    }
    h1 { font-size: 1.1rem; margin: 0 0 4px; color: var(--accent); }
    p { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
    .layout { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
    .frame-wrap { flex-shrink: 0; }
    .frame-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .skin-frame {
      width: var(--frame-w);
      height: var(--frame-h);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      position: relative;
    }
    .skin-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--pos-x, 50%) var(--pos-y, 50%);
      transform: scale(var(--loadout-zoom, 1.149));
      transform-origin: var(--pos-x, 50%) var(--pos-y, 50%);
      display: block;
    }
    .controls {
      flex: 1;
      min-width: 260px;
      max-width: 420px;
      background: rgba(8, 12, 22, 0.98);
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 16px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin: 12px 0 6px;
      color: #cbd5e1;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #1e3a5f;
      background: #0f1724;
      color: var(--text);
      font-size: 0.85rem;
    }
    input[type="range"] { width: 100%; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(125, 211, 252, 0.12);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    code { font-size: 0.78rem; color: #93c5fd; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Skin loadout frame — 586×940</h1>
  <p>
    Centered crop from a <strong>1920×1080</strong> loadout shot. Ratio <strong>586:940</strong> (~5:8).
    Default zoom <strong>1080÷940 ≈ 1.149</strong> — uniform scale, no horizontal squash.
  </p>

  <div class="layout">
    <div class="frame-wrap">
      <div class="frame-label">Preview · 586 × 940</div>
      <div class="skin-frame" id="frame">
        <img id="preview" alt="Skin preview" />
      </div>
    </div>

    <div class="controls">
      <label for="imagePath">Image path (1920×1080 loadout PNG)</label>
      <input type="text" id="imagePath" value="app/data/God Renders/achilles/Screenshot (108).png" />

      <label for="filePick">Or pick a local file</label>
      <input type="file" id="filePick" accept="image/*" />

      <label>Focal X <span id="posXVal">50</span>%</label>
      <input type="range" id="posX" min="0" max="100" value="50" />

      <label>Focal Y <span id="posYVal">50</span>%</label>
      <input type="range" id="posY" min="0" max="100" value="50" />

      <label>Zoom <span id="zoomVal">1.149</span>× <span style="font-weight:400;color:var(--muted)">(1080÷940)</span></label>
      <input type="range" id="zoom" min="1" max="3" step="0.001" value="1.148936" />

      <div class="row">
        <button type="button" id="reload">Reload path</button>
        <button type="button" id="presetDefault">Reset default crop</button>
      </div>

      <p style="font-size:0.78rem;margin-top:16px;"><code id="resolvedUrl"></code></p>
    </div>
  </div>

  <script>
    const DEFAULT_ZOOM = 1080 / 940;

    const img = document.getElementById('preview');
    const pathInput = document.getElementById('imagePath');
    const filePick = document.getElementById('filePick');
    const posX = document.getElementById('posX');
    const posY = document.getElementById('posY');
    const zoom = document.getElementById('zoom');
    const posXVal = document.getElementById('posXVal');
    const posYVal = document.getElementById('posYVal');
    const zoomVal = document.getElementById('zoomVal');
    const resolvedUrl = document.getElementById('resolvedUrl');
    const frame = document.getElementById('frame');

    function repoRootFromScript() {
      return new URL('../', window.location.href);
    }

    function loadFromPath(relPath) {
      const clean = relPath.replace(/^\/+/, '').replace(/\\/g, '/');
      const url = new URL(clean, repoRootFromScript());
      img.src = url.href;
      resolvedUrl.textContent = url.href;
    }

    function updateFocal() {
      posXVal.textContent = posX.value;
      posYVal.textContent = posY.value;
      zoomVal.textContent = Number(zoom.value).toFixed(3);
      frame.style.setProperty('--pos-x', posX.value + '%');
      frame.style.setProperty('--pos-y', posY.value + '%');
      frame.style.setProperty('--loadout-zoom', zoom.value);
    }

    function resetDefault() {
      posX.value = '50';
      posY.value = '50';
      zoom.value = String(DEFAULT_ZOOM);
      updateFocal();
    }

    pathInput.addEventListener('change', () => loadFromPath(pathInput.value));
    document.getElementById('reload').addEventListener('click', () => loadFromPath(pathInput.value));
    document.getElementById('presetDefault').addEventListener('click', resetDefault);
    filePick.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      img.src = URL.createObjectURL(f);
      resolvedUrl.textContent = f.name + ' (local file)';
    });
    posX.addEventListener('input', updateFocal);
    posY.addEventListener('input', updateFocal);
    zoom.addEventListener('input', updateFocal);

    resetDefault();
    loadFromPath(pathInput.value);
  </script>
</body>
</html>
